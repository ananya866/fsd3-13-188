<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | BrightPath Tuition</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <nav class="navbar"><div class="nav-inner">
    <a class="logo" href="index.html"><span>✦</span> BrightPath Tuition</a>
    <div class="nav-links"><a href="index.html" class="">Home</a><a href="registration.html" class="">Registration</a><a href="login.html" class="">Login</a><a href="courses.html" class="">Courses</a><a href="feedback.html" class="active">Feedback</a><a href="price-details.html" class="">Price Details</a></div>
  </div></nav>
  <main>
<div class="form-wrap">
  <h1>Share Your Feedback</h1><p class="subtitle">Your suggestions help us make learning better.</p>
  <form action="#" method="post">
    <div class="field"><label for="name">Your Name</label><input id="name" name="name" type="text" placeholder="Enter your name" required></div>
    <div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" placeholder="name@example.com"></div>
    <div class="field"><label for="course">Course</label><select id="course" name="course"><option value="">Select a course</option><option>Mathematics</option><option>Science</option><option>English</option><option>All Subjects</option></select></div>
    <div class="field"><label for="rating">Your Rating</label><select id="rating" name="rating" required><option value="">Choose a rating</option><option>5 - Excellent</option><option>4 - Very Good</option><option>3 - Good</option><option>2 - Fair</option><option>1 - Needs Improvement</option></select></div>
    <div class="field"><label for="feedback">Feedback</label><textarea id="feedback" name="feedback" placeholder="Write your feedback here..." required></textarea></div>
    <button class="btn" type="submit">Send Feedback <i class="fa-solid fa-paper-plane"></i></button>
  </form>
  <div class="notice">Demo form: feedback is not saved until a backend is connected.</div>
</div>
</main>
  <footer><div class="footer-inner">
    <div><strong>BrightPath Tuition</strong><div class="small">Learn today. Lead tomorrow.</div></div>
    <div class="social" aria-label="Social media links">
      <a href="https://www.facebook.com/" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>

      <a href="https://www.linkedin.com/" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>
    <div class="small">© 2026 BrightPath Tuition. All rights reserved.</div>
  </div></footer>
</body>
</html>
